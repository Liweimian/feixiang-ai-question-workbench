<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="飞象AI题库 · 我的文件夹与题单" />
    <title>我的 · 飞象AI题库</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="./my-resources.css?v=20260821mytabs2" />
  </head>
  <body class="my-resources-page">
    <header class="resources-topbar">
      <nav class="resources-breadcrumb" aria-label="当前位置">
        <a class="resources-back" href="./index.html" aria-label="返回首页"><i class="ri-arrow-left-line"></i></a>
        <a href="./index.html">首页</a>
      </nav>
      <nav class="resources-top-tabs" aria-label="我的分类">
        <button class="is-active" type="button" data-top-view="created"><i class="ri-file-add-line"></i><span>我的创建</span></button>
        <button type="button" data-top-view="favorites"><i class="ri-star-line"></i><span>我的收藏</span></button>
        <button type="button" data-top-view="downloads"><i class="ri-download-cloud-2-line"></i><span>我的下载</span></button>
      </nav>
      <button class="resources-ai-button" id="resourcesAiButton" type="button" aria-expanded="false">
        <i class="ri-sparkling-2-line"></i><span>AI 助手</span>
      </button>
    </header>

    <main class="resources-layout resources-library-layout">
      <section class="resources-content" aria-label="资源列表">
        <div class="resources-library-toolbar">
          <label class="resources-search">
            <i class="ri-search-line"></i>
            <input id="resourceSearch" type="search" placeholder="搜索文件夹或题单" aria-label="搜索文件夹或题单" autocomplete="off" />
          </label>
          <button class="resources-sort" id="resourceSortButton" type="button" data-order="desc">
            <i class="ri-sort-desc"></i><span>最近更新</span>
          </button>
          <span class="resources-toolbar-divider" aria-hidden="true"></span>
          <button class="resources-icon-tool" id="newFolderButton" type="button" title="新建文件夹" aria-label="新建文件夹">
            <i class="ri-folder-add-line"></i>
          </button>
          <button class="resources-icon-tool is-primary" id="uploadResourceButton" type="button" title="上传文件" aria-label="上传文件">
            <i class="ri-upload-cloud-2-line"></i>
          </button>
          <input id="resourceFileInput" type="file" accept="application/pdf,.pdf" hidden />
        </div>

        <section class="resources-folder-section" id="resourcesFolderSection" aria-labelledby="folderSectionTitle">
          <header class="resources-section-head">
            <div><i class="ri-folder-3-line"></i><h2 id="folderSectionTitle">文件夹</h2></div>
            <small>点击文件夹查看其中的题单</small>
          </header>
          <div class="resources-folder-grid" id="resourcesFolderGrid"></div>
        </section>

        <section class="resources-question-section" aria-labelledby="questionListTitle">
          <header class="resources-section-head resources-question-head">
            <div><i class="ri-file-list-3-line"></i><h2 id="questionListTitle">题单</h2></div>
            <span id="resourceResultSummary">正在载入题单…</span>
          </header>
          <div class="resources-list-toolbar">
            <label><input id="selectAllResources" type="checkbox" /><span>全选本页</span></label>
          </div>
          <div class="resources-list" id="resourcesList" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <aside class="resources-ai-panel" id="resourcesAiPanel" hidden aria-label="AI 助手">
      <header>
        <div><span><i class="ri-sparkling-2-line"></i></span><p><strong>AI 助手</strong><small>找题、录题、整理资源</small></p></div>
        <button id="closeResourcesAi" type="button" aria-label="关闭 AI 助手"><i class="ri-close-line"></i></button>
      </header>
      <div class="resources-ai-body">
        <div class="resources-ai-message">你好，我可以帮你快速找到已有题单，也可以上传 PDF 自动录题。</div>
        <button type="button" data-ai-prompt="帮我找最近创建的七年级数学题单">找最近创建的题单</button>
        <button type="button" data-ai-upload>上传 PDF 录题</button>
      </div>
      <form class="resources-ai-compose" id="resourcesAiForm">
        <input id="resourcesAiInput" type="text" placeholder="描述你想查找或创建的资源" />
        <button type="submit" aria-label="发送"><i class="ri-send-plane-2-fill"></i></button>
      </form>
    </aside>

    <div class="resources-toast" id="resourcesToast" role="status"></div>
    <script src="./my-resources.js?v=20260821mytabs1"></script>
  </body>
</html>
